# NADA Repositories Registry
# Community-maintained catalog of National Data Archive (NADA) installations worldwide.
#
# Schema:
#   name: Human-readable name of the repository / archive
#   hostname: Server domain hostname
#   url: Full web catalog endpoint URL
#   country_code: Two-letter ISO 3166-1 alpha-2 country code (or null for international/regional)
#   custodian: (Optional) Organization responsible for the archive
#     name: Organization name
#     url: Organization home page URL
#     ror: Research Organization Registry (ROR) identifier (e.g. 033jfe446)
#   geocoverage: (Optional) Geographic coverage scope
#     level: Coverage level (global | regional | national | subnational | city | other)
#     description: Description of the coverage region or country
#     geonames: List of GeoNames URIs (e.g. https://www.geonames.org/...)
#   domains: (Optional) List of domain / topical coverage areas (e.g. official-statistics, health)

